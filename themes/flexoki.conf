# Nomadys-PDF theme: Flexoki (kepano/flexoki)
# Use it with one line in ~/.config/nomadys-pdf/config:  include = flexoki
# page_bg / page_fg: paper and ink of the pages in dark mode (light mode keeps them white).

[light]
background = #b7b5ac
tab_bg = #f2f0e5
tab_fg = #6e6d68
tab_active_bg = #fffcf0
tab_active_fg = #100f0f
tab_accent = #205ea6
bar_bg = #f2f0e5
bar_fg = #100f0f
bar_cursor = #bc5215
message_bg = #282726
message_fg = #fffcf0
panel_bg = #fffcf0
panel_fg = #100f0f
panel_selected_bg = #dad8ce
panel_selected_fg = #100f0f
panel_header = #6f6e69
comment_bg = #f2f0e5
comment_fg = #100f0f
comment_marker = #bc5215
selection = #205ea6
search_match = #ad8301
caret = #af3029
form_focus = #24837b
mode_normal = #6f6e69
mode_cursor = #205ea6
mode_visual = #5e409d
mode_area = #bc5215
mode_insert = #66800b
mode_command = #ad8301

[dark]
background = #100f0f
tab_bg = #282726
tab_fg = #8f8d89
tab_active_bg = #1c1b1a
tab_active_fg = #cecdc3
tab_accent = #4385be
bar_bg = #282726
bar_fg = #cecdc3
bar_cursor = #da702c
message_bg = #343331
message_fg = #cecdc3
panel_bg = #1c1b1a
panel_fg = #cecdc3
panel_selected_bg = #403e3c
panel_selected_fg = #cecdc3
panel_header = #878580
comment_bg = #282726
comment_fg = #cecdc3
comment_marker = #da702c
selection = #4385be
search_match = #d0a215
caret = #d14d41
form_focus = #3aa99f
page_bg = #1c1b1a
page_fg = #d1d0c7
mode_normal = #878580
mode_cursor = #4385be
mode_visual = #8b7ec8
mode_area = #da702c
mode_insert = #879a39
mode_command = #d0a215
