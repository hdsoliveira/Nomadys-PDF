# Nomadys-PDF theme: GitHub (primer/github-vscode-theme)
# Use it with one line in ~/.config/nomadys-pdf/config:  include = github
# page_bg / page_fg: paper and ink of the pages in dark mode (light mode keeps them white).

[light]
background = #afb8c1
tab_bg = #f6f8fa
tab_fg = #656d76
tab_active_bg = #ffffff
tab_active_fg = #1f2328
tab_accent = #0969da
bar_bg = #f6f8fa
bar_fg = #1f2328
bar_cursor = #bc4c00
message_bg = #24292f
message_fg = #ffffff
panel_bg = #ffffff
panel_fg = #1f2328
panel_selected_bg = #ddf4ff
panel_selected_fg = #1f2328
panel_header = #656d76
comment_bg = #f6f8fa
comment_fg = #1f2328
comment_marker = #bc4c00
selection = #0969da
search_match = #9a6700
caret = #cf222e
form_focus = #1b7c83
mode_normal = #656d76
mode_cursor = #0969da
mode_visual = #8250df
mode_area = #bc4c00
mode_insert = #1a7f37
mode_command = #9a6700

[dark]
background = #010409
tab_bg = #161b22
tab_fg = #7d8590
tab_active_bg = #0d1117
tab_active_fg = #e6edf3
tab_accent = #2f81f7
bar_bg = #161b22
bar_fg = #e6edf3
bar_cursor = #db6d28
message_bg = #30363d
message_fg = #e6edf3
panel_bg = #0d1117
panel_fg = #e6edf3
panel_selected_bg = #1f3a5f
panel_selected_fg = #e6edf3
panel_header = #7d8590
comment_bg = #161b22
comment_fg = #e6edf3
comment_marker = #db6d28
selection = #58a6ff
search_match = #d29922
caret = #f85149
form_focus = #39c5cf
page_bg = #0d1117
page_fg = #e6edf3
mode_normal = #7d8590
mode_cursor = #58a6ff
mode_visual = #a371f7
mode_area = #db6d28
mode_insert = #3fb950
mode_command = #d29922
