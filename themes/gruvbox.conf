# Nomadys-PDF theme: Gruvbox (morhetz/gruvbox)
# Use it with one line in ~/.config/nomadys-pdf/config:  include = gruvbox
# page_bg / page_fg are the paper and ink colours of pages in dark mode.

[light]
background = #d5c4a1
tab_bg = #ebdbb2
tab_fg = #7c6f64
tab_active_bg = #fbf1c7
tab_active_fg = #3c3836
tab_accent = #b57614
bar_bg = #ebdbb2
bar_fg = #3c3836
bar_cursor = #af3a03
message_bg = #3c3836
message_fg = #fbf1c7
panel_bg = #fbf1c7
panel_fg = #3c3836
panel_selected_bg = #d5c4a1
panel_selected_fg = #282828
panel_header = #7c6f64
comment_bg = #ebdbb2
comment_fg = #3c3836
comment_marker = #af3a03
selection = #076678
search_match = #b57614
caret = #af3a03
form_focus = #427b58
page_bg = #fbf1c7
page_fg = #3c3836

[dark]
background = #1d2021
tab_bg = #3c3836
tab_fg = #a89984
tab_active_bg = #504945
tab_active_fg = #ebdbb2
tab_accent = #fabd2f
bar_bg = #3c3836
bar_fg = #ebdbb2
bar_cursor = #fe8019
message_bg = #504945
message_fg = #ebdbb2
panel_bg = #282828
panel_fg = #ebdbb2
panel_selected_bg = #504945
panel_selected_fg = #fabd2f
panel_header = #a89984
comment_bg = #3c3836
comment_fg = #ebdbb2
comment_marker = #fe8019
selection = #83a598
search_match = #fabd2f
caret = #fe8019
form_focus = #8ec07c
page_bg = #282828
page_fg = #ebdbb2
