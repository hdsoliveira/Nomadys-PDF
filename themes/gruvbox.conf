bar_fg = #ebdbb2
bar_cursor = #fe8019
message_bg = #504945
message_fg = #ebdbb2
panel_bg = #282828
panel_fg = #ebdbb2
panel_selected_bg = #504945
panel_selected_fg = #fabd2f
panel_header = #a89984
comment_bg = #3c3836
comment_fg = #ebdbb2
comment_marker = #fe8019
selection = #83a598
search_match = #fabd2f
caret = #fe8019
form_focus = #8ec07c
page_bg = #282828
page_fg = #ebdbb2
mode_normal = #a89984
mode_cursor = #83a598
mode_visual = #d3869b
mode_area = #fe8019
mode_insert = #b8bb26
