# Nomadys-PDF theme: One Light / One Dark (atom)
# Use it with one line in ~/.config/nomadys-pdf/config:  include = one
# page_bg / page_fg: paper and ink of the pages in dark mode (light mode keeps them white).

[light]
background = #a0a1a7
tab_bg = #f0f0f1
tab_fg = #696c77
tab_active_bg = #fafafa
tab_active_fg = #383a42
tab_accent = #4078f2
bar_bg = #f0f0f1
bar_fg = #383a42
bar_cursor = #986801
message_bg = #383a42
message_fg = #fafafa
panel_bg = #fafafa
panel_fg = #383a42
panel_selected_bg = #e5e5e6
panel_selected_fg = #383a42
panel_header = #696c77
comment_bg = #f0f0f1
comment_fg = #383a42
comment_marker = #986801
selection = #4078f2
search_match = #c18401
caret = #e45649
form_focus = #0184bc
mode_normal = #696c77
mode_cursor = #4078f2
mode_visual = #a626a4
mode_area = #986801
mode_insert = #50a14f
mode_command = #c18401

[dark]
background = #1b1d23
tab_bg = #21252b
tab_fg = #868b95
tab_active_bg = #282c34
tab_active_fg = #dcdfe4
tab_accent = #61afef
bar_bg = #21252b
bar_fg = #dcdfe4
bar_cursor = #d19a66
message_bg = #3e4451
message_fg = #dcdfe4
panel_bg = #282c34
panel_fg = #dcdfe4
panel_selected_bg = #3e4451
panel_selected_fg = #dcdfe4
panel_header = #8f939c
comment_bg = #21252b
comment_fg = #dcdfe4
comment_marker = #d19a66
selection = #61afef
search_match = #e5c07b
caret = #e06c75
form_focus = #56b6c2
page_bg = #282c34
page_fg = #e2e5e9
mode_normal = #7f848e
mode_cursor = #61afef
mode_visual = #c678dd
mode_area = #d19a66
mode_insert = #98c379
mode_command = #e5c07b
