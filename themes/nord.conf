# Nomadys-PDF theme: Nord (nordtheme.com): an arctic, north-bluish palette
# Use it with one line in ~/.config/nomadys-pdf/config:  include = nord
# page_bg / page_fg: paper and ink of the pages in dark mode (light mode keeps them white).

[light]
background = #d8dee9
tab_bg = #e5e9f0
tab_fg = #4c566a
tab_active_bg = #eceff4
tab_active_fg = #2e3440
tab_accent = #5e81ac
bar_bg = #e5e9f0
bar_fg = #2e3440
bar_cursor = #5e81ac
message_bg = #3b4252
message_fg = #eceff4
panel_bg = #eceff4
panel_fg = #2e3440
panel_selected_bg = #d8dee9
panel_selected_fg = #2e3440
panel_header = #4c566a
comment_bg = #e5e9f0
comment_fg = #2e3440
comment_marker = #bf616a
selection = #5e81ac
search_match = #d08770
caret = #bf616a
form_focus = #8fbcbb
mode_normal = #4c566a
mode_cursor = #5e81ac
mode_visual = #b48ead
mode_area = #d08770
mode_insert = #a3be8c
mode_command = #ebcb8b

[dark]
background = #242933
tab_bg = #3b4252
tab_fg = #81a1c1
tab_active_bg = #434c5e
tab_active_fg = #eceff4
tab_accent = #88c0d0
bar_bg = #3b4252
bar_fg = #eceff4
bar_cursor = #88c0d0
message_bg = #434c5e
message_fg = #eceff4
panel_bg = #2e3440
panel_fg = #eceff4
panel_selected_bg = #434c5e
panel_selected_fg = #88c0d0
panel_header = #81a1c1
comment_bg = #3b4252
comment_fg = #eceff4
comment_marker = #d08770
selection = #81a1c1
search_match = #ebcb8b
caret = #bf616a
form_focus = #8fbcbb
page_bg = #2e3440
page_fg = #d8dee9
mode_normal = #4c566a
mode_cursor = #88c0d0
mode_visual = #b48ead
mode_area = #d08770
mode_insert = #a3be8c
mode_command = #ebcb8b
