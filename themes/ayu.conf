# Nomadys-PDF theme: Ayu (ayu-theme/ayu-colors)
# Use it with one line in ~/.config/nomadys-pdf/config:  include = ayu
# page_bg / page_fg: paper and ink of the pages in dark mode (light mode keeps them white).

[light]
background = #8a9199
tab_bg = #f3f4f5
tab_fg = #6e7075
tab_active_bg = #fcfcfc
tab_active_fg = #53575c
tab_accent = #ffaa33
bar_bg = #f3f4f5
bar_fg = #4f5357
bar_cursor = #fa8d3e
message_bg = #5c6166
message_fg = #ffffff
panel_bg = #fcfcfc
panel_fg = #53575c
panel_selected_bg = #e7e8e9
panel_selected_fg = #5c6166
panel_header = #72757a
comment_bg = #f3f4f5
comment_fg = #4f5357
comment_marker = #fa8d3e
selection = #399ee6
search_match = #f2ae49
caret = #e65050
form_focus = #4cbf99
mode_normal = #787b80
mode_cursor = #399ee6
mode_visual = #a37acc
mode_area = #fa8d3e
mode_insert = #86b300
mode_command = #f2ae49

[dark]
background = #05070a
tab_bg = #0b0e14
tab_fg = #747b89
tab_active_bg = #0d1017
tab_active_fg = #bfbdb6
tab_accent = #e6b450
bar_bg = #0b0e14
bar_fg = #bfbdb6
bar_cursor = #ff8f40
message_bg = #1b1f29
message_fg = #bfbdb6
panel_bg = #0d1017
panel_fg = #bfbdb6
panel_selected_bg = #1b3a5b
panel_selected_fg = #bfbdb6
panel_header = #747c8a
comment_bg = #0b0e14
comment_fg = #bfbdb6
comment_marker = #ff8f40
selection = #59c2ff
search_match = #ffb454
caret = #d95757
form_focus = #95e6cb
page_bg = #0d1017
page_fg = #c7c5bf
mode_normal = #6c7380
mode_cursor = #59c2ff
mode_visual = #d2a6ff
mode_area = #ff8f40
mode_insert = #aad94c
mode_command = #ffb454
