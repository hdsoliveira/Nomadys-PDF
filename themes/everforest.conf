# Nomadys-PDF theme: Everforest (sainnhe/everforest: Light / Dark medium)
# Use it with :theme everforest (or \T), or in ~/.config/nomadys-pdf/config: include = everforest
# page_bg / page_fg: paper and ink of the pages in dark mode (light mode keeps them white).

[light]
background = #a6b0a0
tab_bg = #f4f0d9
tab_fg = #637062
tab_active_bg = #efebd4
tab_active_fg = #444e54
tab_accent = #35a77c
bar_bg = #f4f0d9
bar_fg = #475258
bar_cursor = #f57d26
message_bg = #5c6a72
message_fg = #ffffff
panel_bg = #fdf6e3
panel_fg = #4a565c
panel_selected_bg = #e0dcc7
panel_selected_fg = #286688
panel_header = #677566
comment_bg = #efebd4
comment_fg = #444e54
comment_marker = #f57d26
selection = #3a94c5
search_match = #dfa000
caret = #f85552
form_focus = #8da101
mode_normal = #829181
mode_cursor = #3a94c5
mode_visual = #df69ba
mode_area = #f57d26
mode_insert = #8da101
mode_command = #dfa000

[dark]
background = #232a2e
tab_bg = #343f44
tab_fg = #a0aaa3
tab_active_bg = #3d484d
tab_active_fg = #e5decd
tab_accent = #a7c080
bar_bg = #343f44
bar_fg = #dacfb7
bar_cursor = #e69875
message_bg = #475258
message_fg = #f3efe7
panel_bg = #2d353b
panel_fg = #d3c6aa
panel_selected_bg = #475258
panel_selected_fg = #dcbf84
panel_header = #939f97
comment_bg = #3d484d
comment_fg = #e5decd
comment_marker = #e69875
selection = #7fbbb3
search_match = #dbbc7f
caret = #e67e80
form_focus = #a7c080
page_bg = #2d353b
page_fg = #f4f1ea
mode_normal = #859289
mode_cursor = #7fbbb3
mode_visual = #d699b6
mode_area = #e69875
mode_insert = #a7c080
mode_command = #dbbc7f
