# Nomadys-PDF theme: Rose Pine (rosepinetheme.com: Dawn / Main)
# Use it with :theme rose (or \T), or in ~/.config/nomadys-pdf/config: include = rose
# page_bg / page_fg: paper and ink of the pages in dark mode (light mode keeps them white).

[light]
background = #9893a5
tab_bg = #f2e9e1
tab_fg = #6a6683
tab_active_bg = #fffaf3
tab_active_fg = #575279
tab_accent = #907aa9
bar_bg = #f2e9e1
bar_fg = #4e496c
bar_cursor = #d7827e
message_bg = #575279
message_fg = #fdfbf8
panel_bg = #faf4ed
panel_fg = #534e74
panel_selected_bg = #dfdad9
panel_selected_fg = #276781
panel_header = #716d8c
comment_bg = #fffaf3
comment_fg = #575279
comment_marker = #d7827e
selection = #286983
search_match = #ea9d34
caret = #b4637a
form_focus = #56949f
mode_normal = #797593
mode_cursor = #286983
mode_visual = #907aa9
mode_area = #d7827e
mode_insert = #56949f
mode_command = #ea9d34

