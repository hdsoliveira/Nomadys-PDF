# Nomadys-PDF theme: Catppuccin (catppuccin.com: Latte / Mocha)
# Use it with :theme catppuccin (or \T), or in ~/.config/nomadys-pdf/config: include = catppuccin
# page_bg / page_fg: paper and ink of the pages in dark mode (light mode keeps them white).

[light]
background = #9ca0b0
tab_bg = #e6e9ef
tab_fg = #65687d
tab_active_bg = #ccd0da
tab_active_fg = #3a3c50
tab_accent = #8839ef
bar_bg = #e6e9ef
bar_fg = #484b64
bar_cursor = #dc8a78
message_bg = #4c4f69
message_fg = #eff1f5
panel_bg = #eff1f5
panel_fg = #4c4f69
panel_selected_bg = #bcc0cc
panel_selected_fg = #1e1e2e
panel_header = #6a6d82
comment_bg = #ccd0da
comment_fg = #3a3c50
comment_marker = #fe640b
selection = #1e66f5
search_match = #df8e1d
caret = #d20f39
form_focus = #40a02b
mode_normal = #6c6f85
mode_cursor = #1e66f5
mode_visual = #8839ef
mode_area = #fe640b
mode_insert = #40a02b
mode_command = #df8e1d

[dark]
background = #11111b
tab_bg = #181825
tab_fg = #a6adc8
tab_active_bg = #313244
tab_active_fg = #cdd6f4
tab_accent = #cba6f7
bar_bg = #181825
bar_fg = #cdd6f4
bar_cursor = #f5e0dc
message_bg = #45475a
message_fg = #dbe1f7
panel_bg = #1e1e2e
panel_fg = #cdd6f4
panel_selected_bg = #45475a
panel_selected_fg = #cca7f7
panel_header = #a6adc8
comment_bg = #313244
comment_fg = #cdd6f4
comment_marker = #fab387
selection = #89b4fa
search_match = #f9e2af
caret = #f38ba8
form_focus = #a6e3a1
page_bg = #1e1e2e
page_fg = #cdd6f4
mode_normal = #a6adc8
mode_cursor = #89b4fa
mode_visual = #cba6f7
mode_area = #fab387
mode_insert = #a6e3a1
mode_command = #f9e2af
