# Nomadys-PDF theme: Solarized (ethanschoonover.com/solarized): light and dark
# Use it with one line in ~/.config/nomadys-pdf/config:  include = solarized
# page_bg / page_fg are the paper and ink colours of the pages (figures keep theirs).

[light]
background = #eee8d5
tab_bg = #eee8d5
tab_fg = #93a1a1
tab_active_bg = #fdf6e3
tab_active_fg = #586e75
tab_accent = #268bd2
bar_bg = #eee8d5
bar_fg = #586e75
bar_cursor = #cb4b16
message_bg = #073642
message_fg = #eee8d5
panel_bg = #fdf6e3
panel_fg = #586e75
panel_selected_bg = #eee8d5
panel_selected_fg = #073642
panel_header = #93a1a1
comment_bg = #eee8d5
comment_fg = #586e75
comment_marker = #cb4b16
selection = #268bd2
search_match = #b58900
caret = #dc322f
form_focus = #2aa198
page_bg = #fdf6e3
page_fg = #586e75

[dark]
background = #00212b
tab_bg = #073642
tab_fg = #586e75
tab_active_bg = #0a4050
tab_active_fg = #93a1a1
tab_accent = #268bd2
bar_bg = #073642
bar_fg = #93a1a1
bar_cursor = #cb4b16
message_bg = #0a4050
message_fg = #93a1a1
panel_bg = #002b36
panel_fg = #93a1a1
panel_selected_bg = #073642
panel_selected_fg = #b58900
panel_header = #586e75
comment_bg = #073642
comment_fg = #93a1a1
comment_marker = #cb4b16
selection = #268bd2
search_match = #b58900
caret = #dc322f
form_focus = #2aa198
page_bg = #002b36
page_fg = #93a1a1
