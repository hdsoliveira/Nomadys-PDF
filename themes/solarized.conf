# Nomadys-PDF theme: Solarized (ethanschoonover.com/solarized): light and dark
# Use it with one line in ~/.config/nomadys-pdf/config:  include = solarized
# page_bg / page_fg: paper and ink of the pages in dark mode (light mode keeps them white).

[light]
background = #eee8d5
tab_bg = #eee8d5
tab_fg = #5d6b6b
tab_active_bg = #fdf6e3
tab_active_fg = #45575c
tab_accent = #268bd2
bar_bg = #eee8d5
bar_fg = #3e4e53
bar_cursor = #cb4b16
message_bg = #073642
message_fg = #eee8d5
panel_bg = #fdf6e3
panel_fg = #45575c
panel_selected_bg = #eee8d5
panel_selected_fg = #073642
panel_header = #657474
comment_bg = #eee8d5
comment_fg = #3e4e53
comment_marker = #cb4b16
selection = #268bd2
search_match = #b58900
caret = #dc322f
form_focus = #2aa198
mode_normal = #93a1a1
mode_cursor = #268bd2
mode_visual = #6c71c4
mode_area = #cb4b16
mode_insert = #859900
mode_command = #b58900

[dark]
background = #00212b
tab_bg = #073642
tab_fg = #859ca3
tab_active_bg = #0a4050
tab_active_fg = #c7cece
tab_accent = #268bd2
bar_bg = #073642
bar_fg = #b7c0c0
bar_cursor = #cb4b16
message_bg = #0a4050
message_fg = #c7cece
panel_bg = #002b36
panel_fg = #a9b4b4
panel_selected_bg = #073642
panel_selected_fg = #c09200
panel_header = #78929a
comment_bg = #073642
comment_fg = #b7c0c0
comment_marker = #cb4b16
selection = #268bd2
search_match = #b58900
caret = #dc322f
form_focus = #2aa198
page_bg = #002b36
page_fg = #d9dede
mode_normal = #586e75
mode_cursor = #268bd2
mode_visual = #6c71c4
mode_area = #cb4b16
mode_insert = #859900
mode_command = #b58900
