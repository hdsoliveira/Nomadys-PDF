# Nomadys-PDF theme: Dayfox / Nightfox (EdenEast/nightfox.nvim)
# Use it with one line in ~/.config/nomadys-pdf/config:  include = nightfox
# page_bg / page_fg: paper and ink of the pages in dark mode (light mode keeps them white).

[light]
background = #aab0ad
tab_bg = #e4dcd4
tab_fg = #824d5b
tab_active_bg = #f6f2ee
tab_active_fg = #3d2b5a
tab_accent = #2848a9
bar_bg = #e4dcd4
bar_fg = #3d2b5a
bar_cursor = #955f61
message_bg = #3d2b5a
message_fg = #f6f2ee
panel_bg = #f6f2ee
panel_fg = #3d2b5a
panel_selected_bg = #e7d2be
panel_selected_fg = #3d2b5a
panel_header = #824d5b
comment_bg = #e4dcd4
comment_fg = #3d2b5a
comment_marker = #955f61
selection = #2848a9
search_match = #ac5402
caret = #a5222f
form_focus = #287980
mode_normal = #824d5b
mode_cursor = #2848a9
mode_visual = #6e33ce
mode_area = #955f61
mode_insert = #396847
mode_command = #ac5402

[dark]
background = #131a24
tab_bg = #131a24
tab_fg = #71839b
tab_active_bg = #192330
tab_active_fg = #cdcecf
tab_accent = #719cd6
bar_bg = #131a24
bar_fg = #cdcecf
bar_cursor = #f4a261
message_bg = #29394f
message_fg = #cdcecf
panel_bg = #192330
panel_fg = #cdcecf
panel_selected_bg = #2b3b51
panel_selected_fg = #cdcecf
panel_header = #798aa1
comment_bg = #131a24
comment_fg = #cdcecf
comment_marker = #f4a261
selection = #719cd6
search_match = #dbc074
caret = #c94f6d
form_focus = #63cdcf
page_bg = #192330
page_fg = #d6d7d8
mode_normal = #71839b
mode_cursor = #719cd6
mode_visual = #9d79d6
mode_area = #f4a261
mode_insert = #81b29a
