# Nomadys-PDF theme: Tokyo Night (folke/tokyonight): Day and Night
# Use it with one line in ~/.config/nomadys-pdf/config:  include = tokyonight
# page_bg / page_fg: paper and ink of the pages in dark mode (light mode keeps them white).

[light]
background = #d0d5e3
tab_bg = #d5d6db
tab_fg = #848cb5
tab_active_bg = #e9e9ed
tab_active_fg = #3760bf
tab_accent = #2e7de9
bar_bg = #d5d6db
bar_fg = #3760bf
bar_cursor = #9854f1
message_bg = #3760bf
message_fg = #e1e2e7
panel_bg = #e1e2e7
panel_fg = #3760bf
panel_selected_bg = #c4c8da
panel_selected_fg = #3760bf
panel_header = #848cb5
comment_bg = #d5d6db
comment_fg = #3760bf
comment_marker = #b15c00
selection = #2e7de9
search_match = #8c6c3e
caret = #f52a65
form_focus = #007197

[dark]
background = #16161e
tab_bg = #1f2335
tab_fg = #565f89
tab_active_bg = #292e42
tab_active_fg = #c0caf5
tab_accent = #7aa2f7
bar_bg = #1f2335
bar_fg = #c0caf5
bar_cursor = #bb9af7
message_bg = #292e42
message_fg = #c0caf5
panel_bg = #1a1b26
panel_fg = #c0caf5
panel_selected_bg = #292e42
panel_selected_fg = #7dcfff
panel_header = #565f89
comment_bg = #1f2335
comment_fg = #c0caf5
comment_marker = #f7768e
selection = #7aa2f7
search_match = #e0af68
caret = #ff9e64
form_focus = #7dcfff
page_bg = #1a1b26
page_fg = #c0caf5
