# Nomadys-PDF theme: Selenized (jan-warchol/selenized)
# Use it with one line in ~/.config/nomadys-pdf/config:  include = selenized
# page_bg / page_fg: paper and ink of the pages in dark mode (light mode keeps them white).

[light]
background = #909995
tab_bg = #ece3cc
tab_fg = #53676d
tab_active_bg = #fbf3db
tab_active_fg = #3a4d53
tab_accent = #0072d4
bar_bg = #ece3cc
bar_fg = #394c52
bar_cursor = #c25d1e
message_bg = #3a4d53
message_fg = #fbf3db
panel_bg = #fbf3db
panel_fg = #3a4d53
panel_selected_bg = #d5cdb6
panel_selected_fg = #3a4d53
panel_header = #53676d
comment_bg = #ece3cc
comment_fg = #394c52
comment_marker = #c25d1e
selection = #0072d4
search_match = #ad8900
caret = #d2212d
form_focus = #009c8f
mode_normal = #53676d
mode_cursor = #0072d4
mode_visual = #8762c6
mode_area = #c25d1e
mode_insert = #489100
mode_command = #ad8900

[dark]
background = #0a2f39
tab_bg = #184956
tab_fg = #a3b2b6
tab_active_bg = #103c48
tab_active_fg = #cad8d9
tab_accent = #4695f7
bar_bg = #184956
bar_fg = #cfdcdd
bar_cursor = #ed8649
message_bg = #2d5b69
message_fg = #f6f8f8
panel_bg = #103c48
panel_fg = #cad8d9
panel_selected_bg = #2d5b69
panel_selected_fg = #cad8d9
panel_header = #91a3a7
comment_bg = #184956
comment_fg = #cfdcdd
comment_marker = #ed8649
selection = #4695f7
search_match = #dbb32d
caret = #fa5750
form_focus = #41c7b9
page_bg = #103c48
page_fg = #f4f7f7
mode_normal = #72898f
mode_cursor = #4695f7
mode_visual = #af88eb
mode_area = #ed8649
mode_insert = #75b938
mode_command = #dbb32d
