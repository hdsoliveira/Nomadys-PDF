# Nomadys-PDF theme: Dracula (draculatheme.com); light mode uses its official light variant, Alucard
# Use it with one line in ~/.config/nomadys-pdf/config:  include = dracula
# page_bg / page_fg are the paper and ink colours of the pages (figures keep theirs).

[light]
background = #e8e2cf
tab_bg = #efedda
tab_fg = #6c664b
tab_active_bg = #fffbeb
tab_active_fg = #1f1f1f
tab_accent = #644ac9
bar_bg = #efedda
bar_fg = #1f1f1f
bar_cursor = #a3144d
message_bg = #1f1f1f
message_fg = #fffbeb
panel_bg = #fffbeb
panel_fg = #1f1f1f
panel_selected_bg = #cfcfde
panel_selected_fg = #1f1f1f
panel_header = #6c664b
comment_bg = #efedda
comment_fg = #1f1f1f
comment_marker = #a3144d
selection = #036a96
search_match = #846e15
caret = #cb3a2a
form_focus = #14710a
page_bg = #fffbeb
page_fg = #1f1f1f

[dark]
background = #21222c
tab_bg = #343746
tab_fg = #6272a4
tab_active_bg = #44475a
tab_active_fg = #f8f8f2
tab_accent = #bd93f9
bar_bg = #343746
bar_fg = #f8f8f2
bar_cursor = #ff79c6
message_bg = #44475a
message_fg = #f8f8f2
panel_bg = #282a36
panel_fg = #f8f8f2
panel_selected_bg = #44475a
panel_selected_fg = #50fa7b
panel_header = #6272a4
comment_bg = #343746
comment_fg = #f8f8f2
comment_marker = #ffb86c
selection = #bd93f9
search_match = #f1fa8c
caret = #ff79c6
form_focus = #8be9fd
page_bg = #282a36
page_fg = #f8f8f2
