# Nomadys-PDF theme: Kanagawa (rebelot/kanagawa.nvim: Lotus / Wave)
# Use it with :theme kanagawa (or \T), or in ~/.config/nomadys-pdf/config: include = kanagawa
# page_bg / page_fg: paper and ink of the pages in dark mode (light mode keeps them white).

[light]
background = #a09cac
tab_bg = #e5ddb0
tab_fg = #716e61
tab_active_bg = #e7dba0
tab_active_fg = #545464
tab_accent = #624c83
bar_bg = #e5ddb0
bar_fg = #545464
bar_cursor = #c84053
message_bg = #43436c
message_fg = #f2ecbc
panel_bg = #f2ecbc
panel_fg = #545464
panel_selected_bg = #dcd5ac
panel_selected_fg = #4d699b
panel_header = #716e61
comment_bg = #e7dba0
comment_fg = #545464
comment_marker = #cc6d00
selection = #4d699b
search_match = #de9800
caret = #c84053
form_focus = #6f894e
mode_normal = #716e61
mode_cursor = #4d699b
mode_visual = #624c83
mode_area = #cc6d00
mode_insert = #6f894e
mode_command = #de9800

[dark]
background = #16161d
tab_bg = #181820
tab_fg = #727169
tab_active_bg = #2a2a37
tab_active_fg = #dcd7ba
tab_accent = #7e9cd8
bar_bg = #181820
bar_fg = #dcd7ba
bar_cursor = #ff9e3b
message_bg = #363646
message_fg = #dcd7ba
panel_bg = #1f1f28
panel_fg = #dcd7ba
panel_selected_bg = #2d4f67
panel_selected_fg = #e6c384
panel_header = #727169
comment_bg = #2a2a37
comment_fg = #dcd7ba
comment_marker = #ffa066
selection = #7e9cd8
search_match = #e6c384
caret = #e46876
form_focus = #98bb6c
page_bg = #1f1f28
page_fg = #dcd7ba
mode_normal = #727169
mode_cursor = #7e9cd8
mode_visual = #957fb8
mode_area = #ffa066
mode_insert = #98bb6c
mode_command = #e6c384
